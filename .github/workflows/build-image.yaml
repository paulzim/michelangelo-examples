name: Build examples Docker image

# Rebuild and push each project's image whenever its inputs change. One
# matrix entry per project (its own PROJECT_EXTRA build arg and image tag)
# rather than bundling every project into one image -- all pipelines within
# one project (e.g. pytorch_train/xgb_train under california_housing)
# already share that project's own image.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "entrypoint.sh"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "entrypoint.sh"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Every project currently shares one image name (michelangelo-examples),
  # so the tag itself must disambiguate which project's deps got baked in
  # -- otherwise a second project with a different PROJECT_EXTRA would
  # silently overwrite this one under the same :latest tag.
  IMAGE_NAME: ${{ github.repository_owner }}/michelangelo-examples

jobs:
  build:
    name: Build and push (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: california-housing
            python_version: "3.10.14"
          - project: bert-cola
            python_version: "3.10.14"
          - project: gpt-oss-20b-finetune
            python_version: "3.11.11"
          - project: movielens
            python_version: "3.11.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.project }}-sha-
            type=ref,event=branch,prefix=${{ matrix.project }}-
            type=raw,value=${{ matrix.project }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PROJECT_EXTRA=${{ matrix.project }}
            PYTHON_VERSION=${{ matrix.python_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          push: ${{ github.event_name != 'pull_request' }}
